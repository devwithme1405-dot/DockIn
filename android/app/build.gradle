plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def keystorePath = System.getenv("DOCKIN_KEYSTORE")

android {
    namespace 'com.dockin.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dockin.app'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("DOCKIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DOCKIN_KEY_ALIAS") ?: "dockin"
                keyPassword System.getenv("DOCKIN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
