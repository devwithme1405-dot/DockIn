apply plugin: 'com.android.application'

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Android refuses to install a version number lower than the one already on the
// phone, and says almost nothing about why. A build counter can go backwards —
// a workflow renamed or recreated starts again at one — so the number that must
// only ever rise is time itself: minutes since the start of 2020. The readable
// version stays the build number, which is what a person quotes back to you.
def minutesSince2020 = (long) ((System.currentTimeMillis() - 1577836800000L) / 60000L)
def keystorePath = System.getenv("DOCKIN_KEYSTORE")

android {
    namespace = "com.dockin.student"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // The same identity and signing key as the app already on the phone,
        // so this installs over it as an update instead of beside it.
        applicationId "com.dockin.student"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode minutesSince2020.intValue()
        versionName "2.0.${runNumber}"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("DOCKIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DOCKIN_KEY_ALIAS") ?: "dockin"
                keyPassword System.getenv("DOCKIN_KEY_PASSWORD")
            }
            // Every signature scheme: some phones' own installers (MIUI,
            // ColorOS) refuse an APK missing one, saying only "can't install".
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
