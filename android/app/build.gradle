plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Android refuses to install a version number lower than the one already on the
// phone, and says almost nothing about why. A build counter can go backwards —
// a workflow renamed or recreated starts again at one — so the number that must
// only ever rise is time itself: minutes since the start of 2020. The readable
// version stays the build number, which is what a person quotes back to you.
def minutesSince2020 = (long) ((System.currentTimeMillis() - 1577836800000L) / 60000L)
def keystorePath = System.getenv("DOCKIN_KEYSTORE")

android {
    namespace 'com.dockin.app'
    compileSdk 35

    defaultConfig {
        // A new identity on purpose.
        //
        // Android will not replace an installed app whose signature it cannot
        // match, and the message it gives — "app can't be installed" — is the
        // same one it gives for half a dozen unrelated situations, so there is
        // no way to tell from the phone which one you are in. A package name
        // nothing has ever used cannot collide with anything, so this install
        // cannot fail for that reason. The Java package stays as it was; only
        // the identity Android files it under changes.
        applicationId 'com.dockin.student'
        minSdk 26
        targetSdk 35
        versionCode minutesSince2020.intValue()
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("DOCKIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DOCKIN_KEY_ALIAS") ?: "dockin"
                keyPassword System.getenv("DOCKIN_KEY_PASSWORD")
            }
            // Sign it every way there is. Android itself is happy with v2 alone
            // at this minimum version, but the installers some phones ship
            // instead — MIUI's and ColorOS's among them — do their own checks,
            // and a missing signature block is one of the things they refuse
            // over while saying only "app can't be installed".
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
