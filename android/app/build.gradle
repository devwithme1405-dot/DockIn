apply plugin: 'com.android.application'

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Android refuses to install a version number lower than the one already on the
// phone, and says almost nothing about why. A build counter can go backwards —
// a workflow renamed or recreated starts again at one — so the number that must
// only ever rise is time itself: minutes since the start of 2020. The readable
// version stays the build number, which is what a person quotes back to you.
def minutesSince2020 = (long) ((System.currentTimeMillis() - 1577836800000L) / 60000L)
def keystorePath = System.getenv("DOCKIN_KEYSTORE")
// "preview" builds (the DockIn 3 test APK, shared by link only) show the new
// screens and update only from their own release; everything else is "stable".
def channel = (System.getenv("DOCKIN_CHANNEL") ?: "stable").trim()

android {
    namespace = "com.dockin.student"
    // USE_EXACT_ALARM is for the class and deadline reminders. DockIn installs
    // from its own APK, not the Play Store, so Play's alarm-clock-app rule that
    // this lint check enforces does not apply.
    lint {
        disable 'ExactAlarm'
    }
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // The same identity and signing key as the app already on the phone,
        // so this installs over it as an update instead of beside it.
        applicationId "com.dockin.student"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode minutesSince2020.intValue()
        versionName channel == "preview" ? "3.0-preview.${runNumber}" : "3.0.${runNumber}"
        buildConfigField "String", "DOCKIN_CHANNEL", "\"${channel}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("DOCKIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DOCKIN_KEY_ALIAS") ?: "dockin"
                keyPassword System.getenv("DOCKIN_KEY_PASSWORD")
            }
            // Every signature scheme: some phones' own installers (MIUI,
            // ColorOS) refuse an APK missing one, saying only "can't install".
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // DockInMessaging extends Capacitor's push service, so Firebase Messaging is needed here too
    // (same version Capacitor's push plugin uses).
    implementation "com.google.firebase:firebase-messaging:25.0.1"
}

apply from: 'capacitor.build.gradle'

// Push notifications (Firebase): only when google-services.json is present, so
// a build without it still works — it just has no push.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, push notifications are off")
}
